[workspace]
members = ["core", "speech", "embed", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

# Пинкод — 200 000 раундов PBKDF2: в отладочной сборке без оптимизации это секунды на проверку.
# Сейф: PBKDF2 600 000 раундов без оптимизации — секунды на открытие.
[profile.dev.package.ring]
opt-level = 3
[profile.dev.package.sha2]
opt-level = 3
[profile.dev.package.pbkdf2]
opt-level = 3
[profile.dev.package.hmac]
opt-level = 3
# Поиск по смыслу: модель на candle без оптимизации считает в десятки раз медленнее.
[profile.dev.package.candle-core]
opt-level = 3
[profile.dev.package.candle-nn]
opt-level = 3
[profile.dev.package.candle-transformers]
opt-level = 3
[profile.dev.package.gemm-f32]
opt-level = 3
