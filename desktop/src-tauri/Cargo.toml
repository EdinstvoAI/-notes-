[package]
name = "notes-desktop"
description = "<notes> desktop app on Tauri: Windows now, macOS later"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "notes_desktop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notes-core = { path = "../core" }
tauri = { version = "2", features = ["macos-private-api", "protocol-asset", "image-png", "tray-icon"] }
tauri-plugin-dialog = "2"
trash = "5"
ureq = { version = "2", features = ["json"] }
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
raw-window-handle = "0.6"
notes-speech = { path = "../speech" }
notes-embed = { path = "../embed" }
tauri-plugin-global-shortcut = "2"
tauri-plugin-clipboard-manager = "2"
cpal = "0.15"
notify = "6"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Foundation", "Security_Credentials_UI", "Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_StationsAndDesktops", "Win32_System_WinRT", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Системный Liquid Glass под окном (macOS 26+), как у Swift-версии.
tauri-plugin-liquid-glass = "0.1"
# Календарь Apple (EventKit), как `CalendarSync` на маке. Слово Макара — 04.11.2026.
objc2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSDate", "NSError", "NSString", "NSPredicate"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSColor", "NSColorSpace"] }
objc2-event-kit = { version = "0.3", features = ["EKEventStore", "EKEvent", "EKCalendar", "EKCalendarItem", "EKObject", "EKSource", "EKTypes", "EKError", "block2", "objc2-app-kit"] }
block2 = "0.6"
