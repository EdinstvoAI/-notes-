[package]
name = "notes-core"
description = "Vault, notes and tasks for <notes>: plain Markdown files, no database. No OS-specific code."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
unicode-normalization = "0.1"
git2 = { version = "0.20", default-features = false, features = ["https"] }
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
getrandom = "0.2"
serde_json = "1"
# AES-GCM, PBKDF2 и HMAC-SHA1 сейфа. Уже в сборке через ureq → rustls; отдельной загрузки нет.
ring = "0.17"

[dev-dependencies]
tempfile = "3"

# macOS: OpenSSL для git вшит в приложение. Иначе бинарник ищет libssl из Homebrew раннера и падает у людей
# («Library not loaded: /opt/homebrew/*/libssl», 1.1.1-beta).
[target.'cfg(target_os = "macos")'.dependencies]
git2 = { version = "0.20", default-features = false, features = ["https", "vendored-openssl"] }
