# Бета для Windows: тег win-v* → сборка установщика на windows-latest → пре-релиз с .exe.
# Только встроенный GITHUB_TOKEN, без секретов: репозиторий открытый.
name: release-windows

on:
  push:
    tags: ["win-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    defaults: { run: { working-directory: desktop } }
    steps:
      # <notes>.xcodeproj и прочие имена с < > Windows не создаёт: берём только desktop/,
      # а проверку имён NTFS выключаем — эти файлы на диск не попадают.
      - name: checkout desktop
        working-directory: .
        shell: bash
        run: |
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git config core.protectNTFS false && git sparse-checkout set desktop
          git fetch -q --depth 1 origin "$GITHUB_SHA" && git checkout -q FETCH_HEAD
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx tauri build --bundles nsis
      - uses: softprops/action-gh-release@v2
        with:
          name: "<notes> v1.0.0 beta"
          tag_name: win-v1.0.0-beta
          target_commitish: ${{ github.sha }}
          prerelease: true
          body_path: desktop/RELEASE-BETA.md
          files: desktop/target/release/bundle/nsis/*.exe
