# Бета Tauri-версии на обе ОС: пушишь тег `multi-v…` — Actions собирает exe (Windows) и dmg (macOS)
# и выкладывает pre-release. Репозиторий открытый: только GITHUB_TOKEN, без секретов; сборки не подписаны.
name: release
on:
  push:
    tags: ["multi-v*"]
permissions:
  contents: write
jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults: { run: { working-directory: desktop } }
    steps:
      # <notes>.xcodeproj и прочие имена с < > Windows не создаёт: берём только desktop/.
      - name: checkout desktop
        working-directory: .
        shell: bash
        run: |
          git init -q . && git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          git config core.protectNTFS false && git sparse-checkout set desktop
          git fetch -q --depth 1 origin "$GITHUB_SHA" && git checkout -q FETCH_HEAD
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npx tauri build --bundles ${{ matrix.os == 'windows-latest' && 'nsis' || 'dmg' }}
      # Приложение не должно тянуть библиотеки из Homebrew раннера: у людей их нет.
      - name: no homebrew libraries
        if: matrix.os == 'macos-latest'
        run: |
          otool -L target/release/notes-desktop
          ! otool -L target/release/notes-desktop | grep -E "/opt/homebrew|/usr/local/"
      # multi-v1.0.0-beta.2 → «<notes> v1.0.0 beta 2»
      - name: release name
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#multi-}"; v="${v/-beta./ beta }"; v="${v/-beta/ beta}"
          echo "NAME=<notes> $v" >> "$GITHUB_ENV"
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ env.NAME }}
          prerelease: true
          body_path: desktop/RELEASE-BETA.md
          files: |
            desktop/target/release/bundle/nsis/*.exe
            desktop/target/release/bundle/dmg/*.dmg
